services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fuellayer
      POSTGRES_USER: fuellayer
      POSTGRES_PASSWORD: fuellayer
    ports:
      - "5432:5432"
    volumes:
      - fuellayer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuellayer -d fuellayer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fuellayer_postgres_data:

