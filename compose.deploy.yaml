name: fuellayer

x-backend: &backend
  image: fuellayer-backend:${RELEASE_SHA:?Set RELEASE_SHA to the full backend commit being deployed}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      RELEASE_SHA: ${RELEASE_SHA:?Set RELEASE_SHA}
  networks:
    - dokploy-network

x-database: &database
  ENVIRONMENT: production
  DATABASE_URL: ${DATABASE_URL:?Set the internal PostgreSQL URL in Dokploy}

x-provider: &provider
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  RECIPE_IMPORT_MODEL: ${RECIPE_IMPORT_MODEL:-gpt-4.1-mini}

services:
  migrate:
    <<: *backend
    environment: *database
    command: ["sh", "-c", "alembic upgrade head && python scripts/import_foods.py"]
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: [*database, *provider]
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set the FuelLayer Clerk secret key}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?Set the Clerk webhook signing secret}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-fuellayer://}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      RECEIPT_MODEL: ${RECEIPT_MODEL:-}
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=7)"]
      interval: 20s
      timeout: 8s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  worker:
    <<: *backend
    environment:
      <<: [*database, *provider]
    command: ["python", "-m", "fuellayer.modules.recipe_imports.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
